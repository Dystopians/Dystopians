<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="waveDark" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A3069"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="waveLight" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="shadow" x="-30" y="-30" width="1260" height="380">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="24" y="24" width="1152" height="272" rx="28" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="25.5" y="25.5" width="1149" height="269" rx="26.5" stroke="url(#border)" stroke-width="3"/>

  <!-- subtle circles -->
  <circle cx="1000" cy="84" r="42" fill="#38BDF8" opacity="0.12"/>
  <circle cx="1080" cy="110" r="20" fill="#22C55E" opacity="0.12"/>

  <!-- Mount Fuji -->
  <path d="M720 235 L800 120 L885 235 Z" fill="#E5E7EB" opacity="0.95"/>
  <path d="M760 175 L800 120 L838 175 Z" fill="#CBD5E1" opacity="0.9"/>
  <rect x="712" y="232" width="182" height="8" rx="4" fill="#64748B" opacity="0.7"/>

  <!-- far sea -->
  <path d="M0 245 C140 225 240 255 340 245 C460 232 560 255 680 245 C790 235 930 255 1200 238 L1200 320 L0 320 Z" fill="#1E3A8A" opacity="0.35"/>

  <!-- big wave dark -->
  <path d="M40 270
           C90 220 120 155 190 120
           C260 86 330 82 410 118
           C470 145 525 122 588 92
           C676 50 788 36 870 78
           C808 80 742 116 718 182
           C700 230 665 253 620 255
           C580 256 540 236 500 224
           C430 202 374 214 316 252
           C240 300 160 295 40 270 Z"
        fill="url(#waveDark)" opacity="0.96"/>

  <!-- big wave light -->
  <path d="M65 268
           C114 222 147 165 214 132
           C275 101 338 97 403 126
           C458 151 509 132 565 104
           C640 66 733 55 804 88
           C749 98 697 137 680 193
           C665 240 633 260 593 258
           C555 257 522 239 486 227
           C426 208 372 219 320 253
           C250 297 176 292 65 268 Z"
        fill="url(#waveLight)" opacity="0.92"/>

  <!-- crest foam -->
  <path d="M408 118
           C470 88 525 70 585 76
           C632 81 676 96 720 83
           C695 101 673 121 662 147
           C646 137 620 132 592 136
           C545 142 500 131 452 124
           C437 122 422 120 408 118 Z"
        fill="white" opacity="0.95"/>

  <!-- claw foam -->
  <path d="M688 85 C715 60 745 48 780 50" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <path d="M728 80 C760 45 797 34 843 40" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <path d="M772 85 C810 50 850 45 898 58" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <path d="M620 94 C648 74 674 68 705 72" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <path d="M568 106 C592 92 614 88 640 91" stroke="white" stroke-width="7" stroke-linecap="round"/>

  <!-- foam particles -->
  <circle cx="620" cy="112" r="4" fill="white"/>
  <circle cx="654" cy="95" r="4" fill="white"/>
  <circle cx="702" cy="78" r="4" fill="white"/>
  <circle cx="744" cy="63" r="4" fill="white"/>
  <circle cx="790" cy="57" r="4" fill="white"/>
  <circle cx="836" cy="50" r="4" fill="white"/>
  <circle cx="884" cy="61" r="4" fill="white"/>

  <!-- boats -->
  <path d="M230 228 L312 220 L340 227" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M430 214 L515 206 L548 213" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title -->
  <text x="72" y="108" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">
    Dystopians
  </text>

  <text x="74" y="146" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="20">
    Code · Systems · Visual Experiments · Open Source
  </text>

  <!-- chips -->
  <rect x="74" y="180" width="118" height="34" rx="17" fill="#0F766E"/>
  <text x="98" y="202" fill="#ECFEFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    Building
  </text>

  <rect x="206" y="180" width="128" height="34" rx="17" fill="#1D4ED8"/>
  <text x="230" y="202" fill="#EFF6FF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    GitHub Art
  </text>

  <rect x="348" y="180" width="98" height="34" rx="17" fill="#7C3AED"/>
  <text x="372" y="202" fill="#F5F3FF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    Wave
  </text>

  <text x="74" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="16">
    “The waves keep coming.”
  </text>
</svg>